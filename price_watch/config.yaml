name: "Price Watch"
version: "0.1.41"
slug: "price_watch"
# Candidate metadata only; not released or mapped to an immutable image digest.
ingress: true
# Supervisor proxies this port for the embedded WebUI.
ingress_port: 8787
description: "Private price and stock monitoring service for Home Assistant."
url: "https://github.com/carl09/price-watch-addons"
startup: application
boot: auto
arch:
  - amd64
  - aarch64
image: "ghcr.io/carl09/price-watch-app"
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: "Price Watch API"
options:
  api_token: null
  log_level: info
  lorna_jane_shadow_enabled: false
  ingress_cidrs: null
  canonical_origin: null
schema:
  api_token: password
  log_level: list(trace|debug|info|warn|error)
  lorna_jane_shadow_enabled: bool
  ingress_cidrs: str?
  canonical_origin: str?
