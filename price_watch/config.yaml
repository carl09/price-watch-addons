name: "Price Watch"
version: "0.1.43"
slug: "price_watch"
# Candidate metadata only; not released or mapped to an immutable image digest.
ingress: true
# Supervisor proxies this port for the embedded WebUI.
ingress_port: 8787
description: "Private price and stock monitoring service for Home Assistant."
url: "https://github.com/carl09/price-watch-addons"
startup: application
boot: auto
arch:
  - amd64
  - aarch64
image: "ghcr.io/carl09/price-watch-app"
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: "Price Watch API"
options:
  log_level: info
  ingress_cidrs: null
  canonical_origin: null
  cdp_endpoint: null
  pi_worker_model_id: null
  pi_worker_max_tokens: 1024
  azure_openai_api_key: null
  azure_openai_base_url: null
schema:
  log_level: list(trace|debug|info|warn|error)
  ingress_cidrs: str?
  canonical_origin: str?
  cdp_endpoint: str?
  pi_worker_model_id: str?
  pi_worker_max_tokens: int
  azure_openai_api_key: password?
  azure_openai_base_url: str?
configuration:
  log_level:
    name: Log level
    description: Logging detail for the App. Use debug only while diagnosing a problem, then return to info.
  cdp_endpoint:
    name: CDP browser endpoint
    description: Credential-free HTTP(S) CDP endpoint used for unsupported product URLs. Keep it on the trusted private LAN or use an SSH tunnel.
  pi_worker_model_id:
    name: PI worker model
    description: Model identifier for browser product evidence, for example azure-openai-responses/gpt-5.6-luna. Leave unset to disable the browser fallback.
  pi_worker_max_tokens:
    name: PI worker maximum tokens
    description: Maximum response tokens for the bounded product-evidence worker.
  azure_openai_api_key:
    name: Azure OpenAI API key
    description: Optional provider key used by the configured PI worker. Store this as a secret.
  azure_openai_base_url:
    name: Azure OpenAI base URL
    description: Azure OpenAI resource endpoint, for example https://your-resource.openai.azure.com. Required when using the Azure PI worker.
